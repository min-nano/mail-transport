name: CI

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml からデプロイ前のゲートとして呼ばれる
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 依存関係のインストール
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: テスト
        run: pytest
      - name: パッケージのインストール確認 (VM 構成)
        run: |
          python -m venv /tmp/vmvenv
          /tmp/vmvenv/bin/pip install --quiet -r requirements-vm.txt
          /tmp/vmvenv/bin/pip install --quiet --no-deps .
          /tmp/vmvenv/bin/python -m mailtransport.cli --help
      - name: デプロイスクリプトの構文確認
        run: bash -n deploy/gce/*.sh deploy/cloudrun/*.sh
      - name: コンテナのビルド確認 (Cloud Run 構成)
        run: docker build -t mail-transport:ci .
